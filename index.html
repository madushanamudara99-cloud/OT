<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT Milestone Tracker</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 1.2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin-bottom: 15px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 1.1rem; text-align: center; }
        
        /* Milestone Styles */
        .milestone-container { text-align: center; margin-bottom: 10px; }
        .progress-bg { background: #e2e8f0; height: 20px; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.5s ease-in-out; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; margin-top: 10px; }
        .stat-card { background: #f1f5f9; padding: 8px; border-radius: 8px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
        .full { grid-column: span 2; }
        label { display: block; margin-bottom: 4px; font-size: 0.75rem; font-weight: bold; color: #64748b; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-save { background: var(--primary); color: white; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; }
        .ot-val { color: #dc2626; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <h2>Monthly Milestone</h2>
    <div class="milestone-container">
        <label>Target OT Hours</label>
        <input type="number" id="targetInput" value="40" onchange="saveTarget()" style="width: 80px; text-align: center;">
        
        <div class="progress-bg">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                Progress: <b id="percentText">0%</b>
            </div>
            <div class="stat-card">
                Remaining: <b id="remainingText">0h</b>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="input-grid">
        <div class="full">
            <label>Date</label>
            <input type="date" id="workDate">
        </div>
        <div><label>In</label><input type="time" id="inTime" value="08:30"></div>
        <div><label>Out</label><input type="time" id="outTime" value="17:00"></div>
    </div>
    <button class="btn-save" onclick="saveEntry()">Save Entry</button>
</div>

<div class="card">
    <table>
        <thead><tr><th>Date</th><th>In</th><th>Out</th><th>OT</th></tr></thead>
        <tbody id="logBody"></tbody>
    </table>
</div>

<script>
    document.getElementById('workDate').valueAsDate = new Date();
    
    // Load Saved Target
    if(localStorage.getItem('ot_target')) {
        document.getElementById('targetInput').value = localStorage.getItem('ot_target');
    }

    function saveTarget() {
        localStorage.setItem('ot_target', document.getElementById('targetInput').value);
        render();
    }

    function saveEntry() {
        const date = document.getElementById('workDate').value;
        const inT = document.getElementById('inTime').value;
        const outT = document.getElementById('outTime').value;
        
        const toMins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
        let start = toMins(inT), end = toMins(outT);
        if (end < start) end += 1440;

        const ot = Math.max(0, (end - start - 30) / 60 - 8.0);

        let logs = JSON.parse(localStorage.getItem('my_ot_v3') || '[]');
        logs = logs.filter(l => l.date !== date);
        logs.push({ date, inT, outT, ot });
        localStorage.setItem('my_ot_v3', JSON.stringify(logs));
        render();
    }

    function render() {
        const logs = JSON.parse(localStorage.getItem('my_ot_v3') || '[]');
        const target = parseFloat(document.getElementById('targetInput').value) || 1;
        const body = document.getElementById('logBody');
        let totalOT = 0;

        body.innerHTML = '';
        logs.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(item => {
            totalOT += item.ot;
            const displayDate = item.date.split('-').reverse().slice(0, 2).join('/');
            body.innerHTML += `<tr><td>${displayDate}</td><td>${item.inT}</td><td>${item.outT}</td><td class="ot-val">${item.ot.toFixed(2)}</td></tr>`;
        });

        // Update Milestone
        const percent = Math.min(100, (totalOT / target) * 100);
        const remaining = Math.max(0, target - totalOT);
        
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('percentText').innerText = percent.toFixed(1) + '%';
        document.getElementById('remainingText').innerText = remaining.toFixed(2) + 'h';
    }

    render();
</script>
</body>
</html>
